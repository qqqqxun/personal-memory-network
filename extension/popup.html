<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; background: #141820; color: #e8e4d9; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #9aa3b5; }
    label { display: block; margin: 8px 0 4px; color: #9aa3b5; }
    input { width: 100%; box-sizing: border-box; background: #0f131c; color: inherit; border: 1px solid #2c3244; border-radius: 8px; padding: 8px; }
    button { margin-top: 8px; background: #e0a84a; color: #1b1408; border: 0; border-radius: 8px; padding: 8px 10px; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; color: inherit; border: 1px solid #2c3244; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .status { margin-top: 10px; padding: 8px; border-radius: 8px; background: #1b2130; }
    .ok { color: #7cbc8a; }
    .bad { color: #c97b7b; }
  </style>
</head>
<body>
  <h1>个人记忆网络</h1>
  <p id="where">只把当前网页里已经完成的对话发到 127.0.0.1</p>
  <label>本机令牌</label>
  <input id="token" type="password" placeholder="从记忆网络的「接入」页复制" />
  <label>端口</label>
  <input id="port" type="number" value="8765" />
  <div class="row">
    <button id="save">保存连接</button>
    <button id="grab" class="ghost">立即抓取</button>
  </div>
  <label><input id="skip" type="checkbox" style="width:auto" /> 这次对话不记录</label>
  <div id="status" class="status">正在检查本机服务…</div>
  <script src="popup.js"></script>
</body>
</html>
